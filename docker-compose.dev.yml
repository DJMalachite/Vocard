# Full development stack: bot + Lavalink + MongoDB + Piper TTS.
#
# Quickstart:
#   1. cp .env.example .env      (fill in TOKEN and CLIENT_ID)
#   2. docker compose up -d --build
#
# settings.json is created automatically from settings.docker.json on first
# boot. The project directory is mounted into the bot container, so code
# changes only need `docker compose restart vocard` (rebuild only when
# requirements.txt changes).
services:
  vocard:
    build: .
    container_name: vocard-bot
    restart: unless-stopped
    command: sh /app/docker-entrypoint.sh
    environment:
      - TOKEN=${TOKEN:-}
      - CLIENT_ID=${CLIENT_ID:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
      lavalink:
        condition: service_started
      piper:
        condition: service_started

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: vocard-lavalink
    restart: unless-stopped
    environment:
      - _JAVA_OPTIONS=-Xmx512M
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "2333:2333"

  mongodb:
    image: mongo:7
    container_name: vocard-mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  piper:
    image: python:3.12-slim
    container_name: vocard-piper
    restart: unless-stopped
    command: sh -c "pip install --no-cache-dir piper-tts[http] && cd /data && python -m piper.download_voices en_US-lessac-medium && python -m piper.http_server -m en_US-lessac-medium --host 0.0.0.0 --port 5000 --data-dir /data"
    volumes:
      - piper-voices:/data
    ports:
      - "5000:5000"

volumes:
  mongo-data:
  piper-voices:
