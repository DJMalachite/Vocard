server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube support is a plugin in Lavalink v4 (built-in source is deprecated).
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
    # Spotify/Apple Music/Deezer metadata support (playback mirrors to YouTube).
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: "youshallnotpass"
    sources:
      # Disable deprecated built-in YouTube source; the plugin above replaces it.
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true          # required: fetches the bot's TTS announcement clips
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true

plugins:
  youtube:
    enabled: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
  lavasrc:
    # How LavaSrc resolves actual audio for Spotify tracks (metadata from
    # Spotify, playback mirrored from YouTube).
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
    spotify:
      clientId: bf195c08f695403dbe5f247771b28adb
      clientSecret: c7f7267209f94941b6f1c3cd6730b8ae
      customTokenEndpoint: "http://spotify-tokener:49152/api/token"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

logging:
  level:
    root: INFO
    lavalink: INFO
