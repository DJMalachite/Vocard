# Full development stack: bot + NodeLink + MongoDB + Piper TTS + dashboard.
#
# Quickstart:
#   1. cp .env.example .env      (fill in TOKEN and CLIENT_ID)
#   2. cp dashboard/settings.example.json dashboard/settings.json
#   3. docker compose up -d --build
#
# NodeLink replaces Lavalink: it speaks the same v4 API but has built-in
# sources (no youtube-plugin/LavaSrc) and an audio mixer, which is what lets
# TTS announcements play *over* the outgoing song. To go back to Lavalink,
# see docker-compose.lavalink.yml.
#
# settings.json is created from settings.docker.json on first boot. The
# project directory is mounted into the bot container, so code changes only
# need `docker compose restart vocard` (rebuild only when requirements.txt
# changes).
services:
  vocard:
    build: .
    container_name: vocard-bot
    restart: unless-stopped
    command: sh /app/docker-entrypoint.sh
    environment:
      - TOKEN=${TOKEN:-}
      - CLIENT_ID=${CLIENT_ID:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy
      nodelink:
        condition: service_started
      piper:
        condition: service_started
      vocard-dashboard:
        condition: service_started

  nodelink:
    # Built from NodeLink's dev branch rather than the published 3.8.0 image:
    # dev has fixes not yet in a release, including the SABR recovery crash
    # that was taking this container down. Pinned to a commit so rebuilds are
    # reproducible - bump the ref to pick up newer dev commits, or point it
    # back at `image: performanc/nodelink:3.8.0` to go back to the release.
    build:
      context: https://github.com/PerformanC/NodeLink.git#351f5c0080610e2f0a4cc02ca2e15be5e5e90401
      dockerfile: Dockerfile
    image: vocard-nodelink:dev-351f5c0
    container_name: vocard-nodelink
    restart: unless-stopped
    environment:
      - NODELINK_SERVER_HOST=0.0.0.0
      - NODELINK_SERVER_PORT=2333
      - NODELINK_SERVER_PASSWORD=youshallnotpass
      # The node is only reachable from this compose network, and announcement
      # fades send a burst of volume updates that the default per-guild limit
      # (20 requests / 5s) rejects.
      - NODELINK_RATELIMIT_ENABLED=false
      # Cluster mode (on by default) runs players in separate worker
      # processes. When a worker exits, NodeLink fails to clear the player
      # entries its primary process still holds - it splits the player key
      # the wrong way round - so every later request for those guilds answers
      # 404 "Player not found." and playback is dead until a restart. One
      # process handles far more guilds than this deployment has.
      - NODELINK_CLUSTER_ENABLED=false
      # Audio mixer - required for overlay announcements.
      - NODELINK_MIX_ENABLED=true
      - NODELINK_MIX_DEFAULTVOLUME=0.8
      - NODELINK_MIX_MAXLAYERSMIX=10
      - NODELINK_MIX_AUTOCLEANUP=true
      # Sources. YouTube playback needs a cipher service (self-hosted below).
      - NODELINK_SOURCES_YOUTUBE_ENABLED=true
      # yt-cipher serves /get_sts and /decrypt_signature at the root; NodeLink
      # appends those paths, so this must not include a /api suffix.
      - NODELINK_SOURCES_YOUTUBE_CIPHER_URL=http://yt-cipher:8001
      - NODELINK_SOURCES_SOUNDCLOUD_ENABLED=true
      - NODELINK_SOURCES_BANDCAMP_ENABLED=true
      - NODELINK_SOURCES_TWITCH_ENABLED=true
      - NODELINK_SOURCES_VIMEO_ENABLED=true
      # The announcement clips are served over plain HTTP by the bot.
      - NODELINK_SOURCES_HTTP_ENABLED=true
      # Spotify: your own app credentials, or leave blank to use NodeLink's
      # default anonymous token service.
      - NODELINK_SOURCES_SPOTIFY_ENABLED=true
      - NODELINK_SOURCES_SPOTIFY_CLIENTID=${SPOTIFY_CLIENT_ID:-}
      - NODELINK_SOURCES_SPOTIFY_CLIENTSECRET=${SPOTIFY_CLIENT_SECRET:-}
      # Recommendations (sprec:) use Spotify's internal API, which needs an
      # anonymous token rather than app credentials. Point at our own tokener
      # instead of NodeLink's default public one, which times out.
      - NODELINK_SOURCES_SPOTIFY_EXTERNALAUTHURL=http://spotify-tokener:49152/api/token
    ports:
      - "2333:2333"

  spotify-tokener:
    image: ghcr.io/topi314/spotify-tokener:master
    container_name: vocard-spotify-tokener
    restart: unless-stopped
    environment:
      - SPOTIFY_TOKENER_ADDR=0.0.0.0:49152

  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: vocard-yt-cipher
    restart: unless-stopped
    expose:
      - "8001"

  mongodb:
    image: mongo:7
    container_name: vocard-mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  piper:
    image: python:3.12-slim
    container_name: vocard-piper
    restart: unless-stopped
    command: sh -c "pip install --no-cache-dir piper-tts[http] && pip install piper-tts[alignment] && cd /data && python -m piper.download_voices en_US-lessac-medium  && python -m piper.http_server -m en-US-Kratos-high --host 0.0.0.0 --port 5000 --data-dir /data"
    volumes:
      - /home/flameheart/CustomVocard/PiperTTS:/data
    ports:
      - "5000:5000"

  # The other announcement voice: PocketTTS sounds far more natural than Piper
  # but is a real neural model, so it wants a couple of CPU cores and pulls in
  # torch (~200 MB for the CPU wheel, which is why that index is pinned).
  #
  # It sits behind a profile so the default stack stays small. To use it:
  #   docker compose -f docker-compose.yml --profile pocket up -d
  # and set announce_settings.engine to "pocket" in settings.json.
  pocket-tts:
    image: python:3.12-slim
    container_name: vocard-pocket-tts
    restart: unless-stopped
    profiles: ["pocket"]
    # Voice cloning needs the gated kyutai/pocket-tts weights; without a token
    # the server quietly falls back to the built-in voices only.
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    command: sh -c "pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install soundfile && pip install --no-cache-dir pocket-tts && pocket-tts serve --host 0.0.0.0 --port 8002"
    volumes:
      # Model weights and voices, so a restart does not re-download them.
      - pocket-tts-cache:/root/.cache
    ports:
      - "8002:8002"

  vocard-dashboard:
    image: ghcr.io/chocomeow/vocard-dashboard:latest
    container_name: vocard-dashboard
    restart: unless-stopped
    volumes:
      # cp dashboard/settings.example.json dashboard/settings.json first,
      # then fill in the Discord OAuth2 credentials.
      - ./dashboard/settings.json:/app/settings.json
    ports:
      - "8110:8110"

volumes:
  mongo-data:
  piper-voices:
  pocket-tts-cache:
